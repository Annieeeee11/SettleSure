<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f2ee" />
    <meta
      name="description"
      content="SettleSure watches your Razorpay settlements, reconciles in milliseconds, and alerts you the moment something needs attention."
    />
    <meta property="og:title" content="SettleSure — Settlement reconciliation you can prove" />
    <meta
      property="og:description"
      content="CLI, dashboard, and API for 3-way payment settlement reconciliation with deterministic matching and LLM tier-4 escalation."
    />
    <meta property="og:type" content="website" />
    <title>SettleSure</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme");
          document.documentElement.setAttribute(
            "data-theme",
            t === "light" || t === "dark" ? t : "light",
          );
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
