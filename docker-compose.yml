services:
  engine:
    build: .
    image: settlesure
    volumes:
      - ./output:/app/output
      - ./data:/app/data
    command: ["--seed", "42", "--skip-llm", "--no-banner"]

  dashboard:
    image: node:22-bookworm-slim
    working_dir: /app/dashboard
    volumes:
      - ./dashboard:/app/dashboard
      - ./output:/app/output:ro
    ports:
      - "5173:5173"
    command:
      [
        "sh",
        "-c",
        "test -d node_modules || npm ci --prefer-offline --no-audit; cp -f ../output/report.json public/report.json 2>/dev/null || true; npm run dev -- --host 0.0.0.0",
      ]
    depends_on:
      - engine
